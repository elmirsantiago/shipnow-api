
paths:
  /api/loggerTest:
    get:
      tags:
        - Logger
      summary: Probar los niveles de logging
      description: >
        Endpoint interno de validación del sistema de logging
        implementado con Winston.

        Ejecuta los seis niveles configurados:
        debug, http, info, warning, error y fatal.

        No representa una funcionalidad de negocio.

        Está disponible únicamente cuando NODE_ENV
        es distinto de production.

        En producción devuelve ROUTE_NOT_FOUND (404).
      responses:
        "200":
          description: Prueba de logging ejecutada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Prueba de logging ejecutada correctamente
                  levels:
                    type: array
                    items:
                      type: string
                      enum:
                        - debug
                        - http
                        - info
                        - warning
                        - error
                        - fatal
                    example:
                      - debug
                      - http
                      - info
                      - warning
                      - error
                      - fatal

        "404":
          description: >
            Endpoint no disponible en producción.
            Devuelve ROUTE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
