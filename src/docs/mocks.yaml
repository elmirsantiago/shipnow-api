
paths:
  /api/mocks/users:
    get:
      tags:
        - Mocks
      summary: Generar usuarios ficticios
      description: Genera usuarios de prueba sin guardarlos en MongoDB.
      parameters:
        - $ref: "#/components/parameters/MockQuantity"
      responses:
        "200":
          description: Usuarios ficticios generados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidMockQuantity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mocks/couriers:
    get:
      tags:
        - Mocks
      summary: Generar repartidores ficticios
      description: Genera usuarios con rol courier sin persistirlos.
      parameters:
        - $ref: "#/components/parameters/MockQuantity"
      responses:
        "200":
          description: Repartidores ficticios generados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidMockQuantity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mocks/orders:
    get:
      tags:
        - Mocks
      summary: Generar pedidos ficticios
      description: >
        Genera pedidos con referencias simuladas.
        No los inserta en MongoDB.
      parameters:
        - $ref: "#/components/parameters/MockQuantity"
      responses:
        "200":
          description: Pedidos ficticios generados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidMockQuantity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mocks/deliveries:
    get:
      tags:
        - Deliveries
        - Mocks
      summary: Generar entregas ficticias
      description: >
        Genera entregas con pedidos y repartidores simulados.
        No guarda registros en MongoDB.
      parameters:
        - $ref: "#/components/parameters/MockQuantity"
      responses:
        "200":
          description: Entregas ficticias generadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/InvalidMockQuantity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mocks/seed:
    post:
      tags:
        - Mocks
      summary: Insertar datos ficticios en MongoDB
      description: >
        Inserta clientes, repartidores, pedidos y entregas
        relacionados. Requiere al menos un comercio activo.
        La cantidad se recibe mediante el parámetro qty
        de la URL. No requiere cuerpo JSON.
        Cada ejecución agrega nuevos documentos.
        Utilizar únicamente en una base de pruebas.
      parameters:
        - $ref: "#/components/parameters/MockQuantity"
      responses:
        "201":
          description: Datos de prueba insertados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Datos de prueba insertados correctamente
                  inserted:
                    type: object
                    properties:
                      users:
                        type: integer
                        example: 2
                      couriers:
                        type: integer
                        example: 2
                      orders:
                        type: integer
                        example: 2
                      deliveries:
                        type: integer
                        example: 2
        "400":
          description: >
            Cantidad inválida (INVALID_MOCK_QUANTITY)
            o ausencia de comercios activos (NO_ACTIVE_STORES).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    MockQuantity:
      name: qty
      in: query
      required: false
      description: >
        Cantidad de registros ficticios.
        Por defecto 10; mínimo 1 y máximo 100.
        Solo se aceptan números enteros.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 2

  responses:
    InvalidMockQuantity:
      description: Cantidad inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: INVALID_MOCK_QUANTITY
            message: Cantidad de mocks inválida

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
