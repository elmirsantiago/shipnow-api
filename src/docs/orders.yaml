
paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos
      description: Devuelve el listado de pedidos registrados.
      responses:
        "200":
          description: Pedidos obtenidos correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Orders
      summary: Crear un pedido
      description: >
        Crea un pedido asociado a un cliente y un comercio activo.
        El total se calcula automáticamente a partir de los productos.
        El estado inicial es created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - store
                - items
                - deliveryAddress
              properties:
                customer:
                  type: string
                  description: ID MongoDB del cliente existente
                  example: "507f1f77bcf86cd799439011"
                store:
                  type: string
                  description: ID MongoDB del comercio activo
                  example: "507f191e810c19729de860ea"
                deliveryAddress:
                  type: string
                  example: "Mendoza 1200, Rosario"
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                  example: normal
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/OrderItem"
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Datos inválidos, productos incorrectos, prioridad inválida o comercio inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente o comercio inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{oid}:
    parameters:
      - name: oid
        in: path
        required: true
        description: ID MongoDB del pedido
        schema:
          type: string
        example: "507f1f77bcf86cd799439011"

    get:
      tags:
        - Orders
      summary: Obtener pedido por ID
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: ID de pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Orders
      summary: Eliminar pedido
      responses:
        "200":
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: ID de pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{oid}/status:
    put:
      tags:
        - Orders
      summary: Actualizar estado de un pedido
      description: >
        Actualiza el estado de un pedido existente.
        Solo acepta estados definidos en ORDER_STATUS.
      parameters:
        - name: oid
          in: path
          required: true
          description: ID MongoDB del pedido
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - created
                    - assigned
                    - picked_up
                    - in_transit
                    - delivered
                    - cancelled
                  example: assigned
      responses:
        "200":
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: "#/components/schemas/Order"
        "400":
          description: ID inválido o estado no permitido (INVALID_ORDER_STATUS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
