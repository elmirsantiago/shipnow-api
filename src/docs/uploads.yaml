
paths:
  /api/users/{uid}/documents:
    post:
      tags:
        - Users
      summary: Subir documento de usuario
      description: >
        Permite adjuntar un documento PDF, JPG o PNG
        a un usuario existente. El tamaño máximo es 5 MB.
        Los archivos se guardan en el servidor y sus
        metadatos se registran en MongoDB.
      operationId: uploadUserDocument
      parameters:
        - in: path
          name: uid
          required: true
          description: ID del usuario
          schema:
            type: string
          example: "6ad6556d672394bcb3ad8640"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - documentType
                - file
              properties:
                documentType:
                  type: string
                  description: Tipo de documento
                  enum:
                    - dni
                    - license
                    - other
                  example: dni
                file:
                  type: string
                  format: binary
                  description: Archivo PDF, JPG o PNG (máximo 5 MB)
      responses:
        "201":
          description: Documento cargado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documento cargado correctamente
                  payload:
                    type: object
                    properties:
                      userId:
                        type: string
                      document:
                        $ref: "#/components/schemas/UploadedFile"
        "400":
          description: >
            Archivo obligatorio, tipo de documento inválido,
            formato de archivo no permitido o datos incorrectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: El archivo supera los 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno al guardar el archivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{oid}/proof:
    post:
      tags:
        - Orders
      summary: Subir comprobante de pedido
      description: >
        Permite adjuntar un comprobante PDF, JPG o PNG
        a un pedido existente. El tamaño máximo es 5 MB.
        Si el pedido ya tiene un comprobante, se reemplaza
        por el nuevo.
      operationId: uploadOrderProof
      parameters:
        - in: path
          name: oid
          required: true
          description: ID del pedido
          schema:
            type: string
          example: "6ad659fc45e74100be5f8bf5"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Comprobante PDF, JPG o PNG (máximo 5 MB)
      responses:
        "201":
          description: Comprobante cargado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Comprobante cargado correctamente
                  payload:
                    type: object
                    properties:
                      orderId:
                        type: string
                      proof:
                        $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Archivo obligatorio o formato no permitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: El archivo supera los 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno al guardar el archivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    UploadedFile:
      type: object
      properties:
        originalName:
          type: string
          example: prueba_shipnow.pdf
        generatedName:
          type: string
          example: 1794852479609-archivo.pdf
        path:
          type: string
          example: users/documents/1794852479609-archivo.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
          example: application/pdf
        size:
          type: integer
          description: Tamaño en bytes
          example: 26670
        documentType:
          type: string
          nullable: true
          enum:
            - dni
            - license
            - other
          example: dni
        uploadedAt:
          type: string
          format: date-time
          example: "2026-11-16T18:06:01.943Z"
